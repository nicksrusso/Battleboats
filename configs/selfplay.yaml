# Full-game PPO. The learner plays the latest weights. The opponent is a
# uniform draw from the last snapshot_pool checkpoints, except
# random_opponent_frac of games, which are vs a random agent.
# Pre-v0.5.0 official checkpoints were archived in
# ~/Desktop/repos/battleboats_archive/runs_pre_v0.5.0_20261124.tar.zst
# (sha256 c0f63624052c78da0b48d413b23f2b15a6240f554e762adf5e70ca631db69c03).
# Pass --init-checkpoint / set init_checkpoint to warm-start; omit for random init.
#
# poetry run python scripts/train_selfplay.py --config configs/selfplay.yaml

run_dir: runs/selfplay
device: auto
seed: 0
width: 8
height: 8
map_count: 4
updates: 200
rollout_decisions: 2048
max_turns: 80
# Both seats act every turn, and a fleet is many actions before EndTurn.
# 400 stopped games near turn 45. 3000 reaches the 80-turn cap.
# Nothing else inside a game caps steps: the update's episode count cap
# only limits how many games are started.
max_steps: 3000
snapshot_every: 5
snapshot_pool: 4
random_opponent_frac: 0.15
save_every: 10
wandb: false

arch:
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.1

ppo:
  lr: 0.0003
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  ent_coef: 0.01
  # Extra bonus on the build_ship (hull) head, averaged only over build
  # decisions so it is not diluted by asset/verb/move entropy. Joint
  # ent_coef alone left that head at ~0 nats after the sandboxes.
  hull_ent_coef: 0.05
  epochs: 4
  minibatch_size: 256
  max_grad_norm: 0.5
