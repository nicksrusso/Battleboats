# Buy-diversity sandbox fine-tune (no opponent, no self-play).
# Reward is potential-based delta of max(0, 1 - std/mean) over all 8 hulls
# plus a small coverage bonus (training only). Cheap types (destroyer,
# submarine, merchant) are masked with annealed probability p; landing is
# never masked. Evaluate unmasked. CPU only.
# Pre-v0.5.0 official checkpoints were archived in
# ~/Desktop/repos/battleboats_archive/runs_pre_v0.5.0_20261124.tar.zst
# (sha256 c0f63624052c78da0b48d413b23f2b15a6240f554e762adf5e70ca631db69c03).
# init_checkpoint (or --init) is required; there is no default warm start.
init_checkpoint: null
run_dir: runs/sandbox_buydiv_v0.4.0
updates: 300
decisions_per_update: 1024
horizon_turns: 50
sizes:
  - [16, 8]
  - [20, 10]
p_start: 0.7
p_end: 0.0
coverage_coef: 0.25
# Non-buy KL/MSE anchor toward the frozen init. Off for the smoke; turn on
# only if a later vs-tactical / vs-v0.3.0 eval shows move or capture collapse.
anchor_coef: 0.0
lr: 0.0001
gamma: 0.99
lam: 0.95
clip_eps: 0.2
vf_coef: 0.5
ent_coef: 0.01
hull_ent_coef: 0.05
epochs: 4
minibatch_size: 256
max_grad_norm: 0.5
target_kl: 0.05
dropout: 0.0
seed: 0
eval_every: 25
eval_episodes: 16
ckpt_every: 10
window: 25
max_minutes: 40.0
device: cpu
