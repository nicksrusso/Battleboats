# Two updates on a 4x4 board, CPU. Pass --init-checkpoint to warm-start:
#   poetry run python scripts/train_selfplay.py \
#       --config configs/selfplay_smoke.yaml \
#       --init-checkpoint path/to/warmstart.pt

run_dir: runs/selfplay_smoke
device: cpu
seed: 0
# Pre-v0.5.0 official checkpoints were archived in
# ~/Desktop/repos/battleboats_archive/runs_pre_v0.5.0_20261124.tar.zst
# (sha256 c0f63624052c78da0b48d413b23f2b15a6240f554e762adf5e70ca631db69c03).
# Pass --init-checkpoint / set init_checkpoint to warm-start; omit for random init.
width: 4
height: 4
map_count: 1
updates: 2
rollout_decisions: 12
max_turns: 8
max_steps: 24
snapshot_every: 1
snapshot_pool: 2
random_opponent_frac: 0.5
save_every: 1
wandb: false

arch:
  d_model: 32
  nhead: 2
  num_layers: 1
  dim_feedforward: 64
  dropout: 0.0

ppo:
  lr: 0.0003
  epochs: 1
  minibatch_size: 8
  ent_coef: 0.01
  # Extra bonus on the build_ship (hull) head, averaged only over build
  # decisions so it is not diluted by asset/verb/move entropy. Joint
  # ent_coef alone left that head at ~0 nats after the sandboxes.
  hull_ent_coef: 0.05
