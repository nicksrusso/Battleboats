# Short mixed 3x3 warm-up. Every sandbox shares each update, including
# scouting and one build drill per hull. A size advances after min_updates
# once every window clears 0.5; otherwise allow_unmet hands the skill_count=0
# checkpoint on. The update cap stays at 3 so this file does not inherit the
# long training cap.
#
# poetry run python scripts/train_sandboxes.py --config configs/sandboxes_smoke.yaml

run_dir: runs/sandboxes_smoke
device: cpu
seed: 0
success_threshold: 0.5
window: 8
min_updates: 3
max_updates_per_size: 3
max_episodes_per_size: 80
decisions_per_update: 128
rehearsal_frac: 0.15
size_mix_frac: 0.0
eval_every: 100
eval_episodes: 0
allow_unmet: true
save_every: 0
wandb: false

sizes: [3]
skills:
  - merchant
  - builder
  - landing
  - scouting
  - combat_destroyer
  - combat_submarine
  - combat_cruiser
  - combat_battleship
  - combat_carrier
  - build_merchant
  - build_landing
  - build_destroyer
  - build_submarine
  - build_cruiser
  - build_battleship
  - build_carrier
  - build_builder

arch:
  d_model: 32
  nhead: 2
  num_layers: 1
  dim_feedforward: 64
  dropout: 0.0

ppo:
  lr: 0.0005
  epochs: 2
  minibatch_size: 32
  ent_coef: 0.08
  # Extra bonus on the build_ship (hull) head, averaged only over build
  # decisions so it is not diluted by asset/verb/move entropy. Joint
  # ent_coef alone left that head at ~0 nats after the sandboxes.
  hull_ent_coef: 0.05
