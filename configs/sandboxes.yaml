# Sandbox warm-up for the full-game pointer net. skill_count is 0: no skill
# one-hot and no skill embedding. Ship type is the ordinary observation token.
# Every sandbox is sampled in the same update, with an equal decision budget.
# build_<type> is a typed-build drill (see ShipType). Cash starts one income
# tick below that cost. The cue is a visible enemy ship of that type, because
# several hulls share a price. This curriculum keeps the cheap typed builds
# (merchant, destroyer, submarine) and the haul-then-buy builder drill, and
# omits the expensive typed builds (cruiser, battleship, carrier, landing,
# builder) that collapsed after gating on 4x4. build_* uses the same 0.80 /
# 64 success window as the other goal drills.
# Every drill's reward decays linearly with the game turn (not the action
# count): 1 at turn 0, `reward_decay.floor` at `reward_decay.horizon` turns.
# horizon 0 uses that drill's own max_turns. `drills` can override one skill.
# A finish before the horizon pays more than stalling, and an earlier turn
# pays more than a later one. Full-game self-play is not this decay; it stays
# the terminal ±1.
# Rewards are divided by that sandbox's running return scale (max of 1, the
# absolute mean, and the std of discounted returns) so a larger return cannot
# own the gradient. A size advances when every sandbox's live window
# currently clears success_threshold, and only after min_updates. Goal
# drills keep appending on-size episodes after they pass; a drop below
# the bar reopens the drill. Combat keeps a passed flag for the rest of
# that size. Scouting uses the same success bar (detection, not a win).
# rehearsal_frac and size_mix_frac are smaller boards of that same sandbox.
#
# poetry run python scripts/train_sandboxes.py --config configs/sandboxes.yaml --device cpu
#
# Hand the weights to full-game PPO. The checkpoint's model_config is what
# loads, so the self-play arch does not have to be restated:
# poetry run python scripts/train_selfplay.py --config configs/selfplay.yaml \
#     --init-checkpoint runs/sandboxes/latest.pt --device cpu
#
# Final weights: runs/sandboxes/latest.pt
# Per sandbox:   runs/sandboxes/<skill>/final.pt and size_<N>.pt
# Rates:         runs/sandboxes/summary.json
# Each update logs <skill>/success_rate, <skill>/mean_reward, and <skill>/gate
# (wandb too, when wandb is on). The process prints [wandb] on or [wandb] off.
#
# device is configurable. Default is cpu. "auto" uses a GPU when torch can see
# one (ROCm reports as cuda). Rollouts are single-process Python, so a GPU
# only shortens the PPO step.
# wandb: true  or  BATTLEBOATS_WANDB=1
# Missing wandb or no login is a warning, not a crash. The trainer still
# prints whether logging is on.

run_dir: runs/sandboxes
device: cpu
seed: 0
success_threshold: 0.80
window: 64
min_updates: 3
# Combat drills advance on a plateau of a moving average of the per-update
# reward and of value loss, not on a win rate and not on the raw per-update
# mean. plateau_smooth is "mean" (trailing window) or "ema". The gain of
# that average over plateau_updates must stay below plateau_threshold, after
# combat_min_episodes. A combat pass stays passed for that size. With
# allow_unmet: false, hitting max_updates_per_size or max_episodes_per_size
# with an unmet gate stops the run instead of advancing; the stop message
# names the skill that hit the cap. Budgets are 5x the earlier 150 / 400
# so a size has more room to clear the window.
plateau_threshold: 0.02
plateau_updates: 10
plateau_smooth: mean
plateau_smooth_span: 8
combat_min_episodes: 32
max_updates_per_size: 750
max_episodes_per_size: 2000
decisions_per_update: 512
rehearsal_frac: 0.15
size_mix_frac: 0.20
eval_every: 5
eval_episodes: 8
allow_unmet: false
save_every: 10
wandb: false
wandb_project: battleboats-skill-pipeline

# horizon 0 -> each drill's max_turns. floor is the multiplier at that horizon.
# Example override: drills: {merchant: {horizon: 12, floor: 0.05}}
reward_decay:
  horizon: 0
  floor: 0.0

# merchant drill: fixed length (max(12, 4*size) turns, no early end). Each home
# unload pays gold / this episode's max achievable gold (full 100-material
# round trips on the shortest water leg), so the return is ~0..1 and more
# round trips pay more. Builds are masked. An episode is a success when it
# hauls >= merchant_success_frac of that max; the drill gates on the usual
# success window (success_threshold over `window` episodes).
merchant_success_frac: 0.5
# The success window is filled by greedy (argmax) rollouts on the focus size,
# merchant_gate_episodes per update; training stays sampled. Sampled play on
# 1-tile legs makes ~10 of 48 possible deliveries where argmax makes 47-48.
merchant_greedy_gate: true
merchant_gate_episodes: 4
# Potential-based progress shaping: ~25% of each delivery's reward is paid
# along the way for closing water distance to the next delivery (satellite
# when empty, home when loaded); moving away costs the same, and a full round
# trip nets 0, so loops cannot farm it. 0 turns it off.
merchant_progress: 0.25

sizes: [3, 4, 5, 6, 8, 10]
skills:
  - merchant
  - builder
  - landing
  - landing_build
  - scouting
  - combat_destroyer
  - combat_submarine
  - combat_cruiser
  - combat_battleship
  - combat_carrier
  - build_merchant
  - build_destroyer
  - build_submarine

arch:
  d_model: 64
  nhead: 4
  num_layers: 2
  dim_feedforward: 128
  dropout: 0.1

ppo:
  lr: 0.0003
  gamma: 0.99
  lam: 0.95
  clip_eps: 0.2
  vf_coef: 0.5
  # 0.01 (PPO default). 0.05 kept EndTurn vs Build from peaking on
  # expensive build_* drills, where cheaper hulls are already legal.
  ent_coef: 0.01
  epochs: 4
  minibatch_size: 128
  max_grad_norm: 0.5
