# Rerun of value_net_v0.5.0_mixed.yaml after the first 72k run overfit
# (best was epoch 0: val acc 0.841 / Brier 0.1116, then Brier rose).
# Same cache and later-position weighting. Changes vs mixed:
#   k_per_game 16 (pool still 128), lr 1e-4 (1/3 of 3e-4),
#   eval every 1/4 epoch, early-stop patience 8 evals, batch 256
#   (fits the 70% VRAM cap while the GPU is shared).
# See docs/value_net.md.
version: "0.5.0"

data:
  harvest_dir: runs/value_harvest_48x24_fc_mixed_72k_v0.5.0
  cache_dir: runs/value_harvest_48x24_fc_mixed_72k_v0.5.0/value_cache_k128
  k_pool: 128
  k_per_game: 16
  sample_weight_floor: 0.25
  sample_weight_power: 1.0
  val_frac: 0.05
  test_frac: 0.05
  include_draws: false
  seed: 0
  cache_workers: 8

model:
  d_model: 128
  nhead: 8
  num_layers: 4
  dim_feedforward: 256
  dropout: 0.2
  aux_head: true

train:
  epochs: 40
  batch_size: 256
  lr: 0.0001
  weight_decay: 0.02
  warmup_steps: 200
  grad_clip: 1.0
  aux_weight: 0.25
  loss_weight_floor: 0.25
  loss_weight_power: 1.0
  torch_threads: 2
  num_workers: 2
  eval_batch_size: 512
  eval_every_frac: 0.25   # val eval 4 times per epoch; 0 = end of epoch only
  log_every: 50
  max_steps_per_epoch: 0
  device: cuda
  patience: 8             # counted in evals, not epochs
  min_delta: 0.0005
  seed: 0

eval:
  baseline_fit_rows: 60000
  min_acc_margin: 0.02
  brier_margin: 0.005
  gate_baselines: [coin_flip, constant_prior, seat_prior, logistic_simple]

out_root: runs/value_net_v0.5.0_mixed_r2
