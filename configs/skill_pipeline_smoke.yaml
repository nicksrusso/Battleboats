# One update of every sandbox plus one full-game mix update. CPU, tiny net.
# Missed gates still hand the checkpoint on. Writes runs/skill_pipeline_smoke/final.pt.
#
# poetry run python scripts/train_skill_pipeline.py --config configs/skill_pipeline_smoke.yaml

run_dir: runs/skill_pipeline_smoke
device: cpu
seed: 0
allow_unmet: true
save_every: 1
wandb: false

arch:
  d_model: 32
  nhead: 2
  num_layers: 1
  dim_feedforward: 64
  dropout: 0.0

ppo:
  lr: 0.0003
  epochs: 1
  minibatch_size: 8
  ent_coef: 0.02
  # Extra bonus on the build_ship (hull) head, averaged only over build
  # decisions so it is not diluted by asset/verb/move entropy. Joint
  # ent_coef alone left that head at ~0 nats after the sandboxes.
  hull_ent_coef: 0.05

stages:
  - name: skills
    kind: interleave
    max_updates: 1
    eval_every: 1
    eval_episodes: 1
    decisions_per_update: 12
    tasks:
      - {skill: move, width: 2, height: 3, max_turns: 4, max_steps: 12,
         randomize: false, approach_coef: 0.0, success_threshold: 0.0}
      - {skill: merchant, width: 2, height: 3, max_turns: 6, max_steps: 16,
         randomize: false, approach_coef: 0.0, success_threshold: 0.0}
      - {skill: shipyard, width: 2, height: 3, max_turns: 4, max_steps: 8,
         randomize: false, approach_coef: 0.0, success_threshold: 0.0}
      - {skill: combat, width: 2, height: 3, max_turns: 4, max_steps: 12,
         randomize: false, approach_coef: 0.0, success_threshold: 0.0}
      - {skill: landing, width: 2, height: 3, max_turns: 4, max_steps: 12,
         randomize: false, approach_coef: 0.0, success_threshold: 0.0}
      - {skill: builder, width: 2, height: 3, max_turns: 4, max_steps: 12,
         randomize: false, approach_coef: 0.0, success_threshold: 0.0}
      - {skill: opening, width: 4, height: 4, max_turns: 4, max_steps: 12,
         randomize: false, approach_coef: 0.0, success_threshold: 0.0}

  - name: full
    kind: full_mix
    max_updates: 1
    eval_every: 1
    eval_episodes: 1
    decisions_per_update: 12
    width: 4
    height: 4
    max_turns: 4
    max_steps: 16
    map_count: 1
    skill_frac: 0.5
    scripted_frac: 0.5
    win_threshold: 0.0
    scripted_threshold: 0.0
    retain_threshold: 0.0
    tasks:
      - {skill: move, width: 2, height: 3, max_turns: 4, max_steps: 12,
         randomize: false, success_threshold: 0.0}
      - {skill: merchant, width: 2, height: 3, max_turns: 6, max_steps: 16,
         randomize: false, success_threshold: 0.0}
      - {skill: shipyard, width: 2, height: 3, max_turns: 4, max_steps: 8,
         randomize: false, success_threshold: 0.0}
      - {skill: combat, width: 2, height: 3, max_turns: 4, max_steps: 12,
         randomize: false, success_threshold: 0.0}
      - {skill: landing, width: 2, height: 3, max_turns: 4, max_steps: 12,
         randomize: false, success_threshold: 0.0}
      - {skill: builder, width: 2, height: 3, max_turns: 4, max_steps: 12,
         randomize: false, success_threshold: 0.0}
