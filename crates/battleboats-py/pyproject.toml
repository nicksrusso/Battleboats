[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "battleboats-core"
version = "0.1.0"
description = "Rust core of the Battleboats engine (PyO3)"
requires-python = ">=3.11"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
module-name = "battleboats_core"
features = ["extension-module"]
